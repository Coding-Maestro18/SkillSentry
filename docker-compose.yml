# Optional. `docker compose up` then open http://localhost:8000
services:
  skillsentry:
    build: .
    ports: ["8000:8000"]
    environment:
      SKILLSENTRY_MODEL_BASE_URL: http://ollama:11434
      SKILLSENTRY_MODEL_NAME: qwen2.5:7b-instruct
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:0.5.7
    volumes: ["ollama:/root/.ollama"]
    # First run: docker compose exec ollama ollama pull qwen2.5:7b-instruct
volumes:
  ollama:
