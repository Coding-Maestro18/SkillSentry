[project]
name = "skillsentry"
version = "0.1.0"
description = "Security testing workbench for AI Agent Skills: analyze, simulate with mock tools, never execute."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
